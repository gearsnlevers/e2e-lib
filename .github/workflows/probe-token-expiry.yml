name: probe-token-expiry
on: pull_request
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Header names
        env:
          SIGNAL: ${{ secrets.SIGNAL_TOKEN }}
          CONCIERGE: ${{ secrets.CONCIERGE_TOKEN }}
          JOB: ${{ github.token }}
        run: |
          for who in SIGNAL CONCIERGE JOB; do
            for ep in user rate_limit; do
              eval "tok=\$$who"
              GH_TOKEN="$tok" gh api -i "$ep" > /tmp/h.txt 2>&1 || true
              echo "NAMES $who $ep: $(awk '/^\r?$/ {exit} {print}' /tmp/h.txt | cut -d: -f1 | tr -d '\r' | sort -u | tr '\n' ' ')"
              echo "EXPIRY $who $ep: $(awk '/^\r?$/ {exit} {print}' /tmp/h.txt | grep -i -E '^github-authentication-token-expiration' | tr -d '\r' || echo none)"
            done
          done
