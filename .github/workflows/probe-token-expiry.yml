name: probe-token-expiry
on: pull_request
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Header names, signal token
        env:
          GH_TOKEN: ${{ secrets.SIGNAL_TOKEN }}
        run: |
          echo "== names, SIGNAL_TOKEN, user"
          gh api -i user 2>&1 | sed '/^\r\{0,1\}$/q' | cut -d: -f1 | sort | tr '\n' ' '; echo
          echo "== names, SIGNAL_TOKEN, rate_limit"
          gh api -i rate_limit 2>&1 | sed '/^\r\{0,1\}$/q' | cut -d: -f1 | sort | tr '\n' ' '; echo
      - name: Header names, concierge token
        env:
          GH_TOKEN: ${{ secrets.CONCIERGE_TOKEN }}
        run: |
          echo "== names, CONCIERGE_TOKEN, user"
          gh api -i user 2>&1 | sed '/^\r\{0,1\}$/q' | cut -d: -f1 | sort | tr '\n' ' '; echo
      - name: Header names, the job's own token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "== names, GITHUB_TOKEN, rate_limit"
          gh api -i rate_limit 2>&1 | sed '/^\r\{0,1\}$/q' | cut -d: -f1 | sort | tr '\n' ' '; echo
